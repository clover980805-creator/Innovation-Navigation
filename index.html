		<script>
			(function () {
				var cards = Array.prototype.slice.call(document.querySelectorAll(".service-card"));
				var clock = document.getElementById("clock-pill");
				var currentIndex = 0;
				var keyboardMode = false;

				function updateClock() {
					var now = new Date();
					var time = now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
					clock.textContent = time;
					clock.setAttribute("datetime", now.toISOString());
				}

				function setFocusedCard(index) {
					currentIndex = Math.max(0, Math.min(cards.length - 1, index));
					cards.forEach(function (card, cardIndex) {
						card.classList.toggle("is-key-focused", keyboardMode && cardIndex === currentIndex);
						card.setAttribute("tabindex", cardIndex === currentIndex ? "0" : "-1");
					});
					cards[currentIndex].focus({ preventScroll: true });
				}

				function getColumnCount() {
					var styles = window.getComputedStyle(document.querySelector(".services"));
					return styles.gridTemplateColumns.split(" ").length;
				}

				cards.forEach(function (card, index) {
					card.addEventListener("focus", function () {
						currentIndex = index;
						cards.forEach(function (item, itemIndex) {
							item.classList.toggle("is-key-focused", keyboardMode && itemIndex === currentIndex);
						});
					});
					card.addEventListener("pointerenter", function () {
						keyboardMode = false;
						cards.forEach(function (item) {
							item.classList.remove("is-key-focused");
						});
					});
				});

				document.addEventListener("keydown", function (event) {
					var columns = getColumnCount();
					var nextIndex = currentIndex;
					if (event.key === "ArrowRight") nextIndex = currentIndex + 1;
					if (event.key === "ArrowLeft") nextIndex = currentIndex - 1;
					if (event.key === "ArrowDown") nextIndex = currentIndex + columns;
					if (event.key === "ArrowUp") nextIndex = currentIndex - columns;
					if (nextIndex !== currentIndex) {
						event.preventDefault();
						keyboardMode = true;
						setFocusedCard(nextIndex);
					}
					if (event.key === "Enter") {
						var activeCard = cards[currentIndex];
						if (activeCard.tagName === "A" && activeCard.href) {
							event.preventDefault();
							activeCard.click();
						}
					}
				});

				updateClock();
				setInterval(updateClock, 30000);
				cards.forEach(function (card, index) {
					card.setAttribute("tabindex", index === 0 ? "0" : "-1");
				});
			})();
		</script>
